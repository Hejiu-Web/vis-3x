name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 类型检查 / 构建 / 产物校验
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vis-3x
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: vis-3x/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建库
        run: pnpm build

      - name: 校验构建产物
        run: node packages/vis-3x/test/dist-smoke.mjs

      - name: 校验 package.json 导出路径
        run: node scripts/check-exports.mjs

      # 把真正的 tarball 装进一个干净项目，用 tsc（bundler + node16 两种解析）
      # 与 vite build 验证「装完能不能用」。
      # 这一步能抓住 dist-smoke 抓不到的问题：
      #   - d.ts 缺 .js 扩展名（node16 下全部类型声明失效）
      #   - 根入口 export type * 导致类型缺失
      #   - style.css 在 noUncheckedSideEffectImports 下报 TS2307
      - name: 真实消费者验证（tarball + tsc + vite build）
        run: node scripts/verify-consumer.mjs

  build-playground:
    name: 构建演示站点
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vis-3x
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: vis-3x/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter vis-3x build
      - name: 构建 Playground（带 Pages base）
        env:
          PLAYGROUND_BASE: /vis-3x/playground/
        run: pnpm --filter vis-3x-playground build

  docs:
    name: 构建文档站与门户首页
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: vis-3x/pnpm-lock.yaml

      # 文档站通过 resolve-vis3x.mjs 解析相邻的 vis-3x 源码，
      # 所以要先装库依赖（源码模式不需要构建产物，但装依赖更稳妥）
      - name: 安装图表库依赖
        working-directory: vis-3x
        run: pnpm install --frozen-lockfile

      - name: 安装文档站依赖
        working-directory: vis-3x-md
        run: npm install

      - name: 校验文档代码块语法
        working-directory: vis-3x-md
        run: npm run check:js

      - name: 构建文档站
        working-directory: vis-3x-md
        env:
          DOCS_BASE: /vis-3x/
        run: npm run build

      - name: 构建门户首页
        working-directory: vis-3x-md
        env:
          VITE_SITE_BASE: /vis-3x/
        run: npm run home:build

      - name: 校验产物
        working-directory: vis-3x-md
        run: |
          test -f docs/.vitepress/dist/index.html || { echo "文档站首页缺失"; exit 1; }
          test -f dist-home/index.html || { echo "门户首页缺失"; exit 1; }
          echo "文档站页面数: $(find docs/.vitepress/dist -name '*.html' | wc -l)"
